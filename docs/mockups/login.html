<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar no Fatturo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F7A28}a:hover{color:#1B4A20}
</style>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #FFFFFF; color: #16302B; font-family: 'Montserrat', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

<aside style="flex: 1 1 360px; box-sizing: border-box; background: #16302B; color: #FFFFFF; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
<div style="font-weight: 700; font-size: 20px">Fatturo</div>
<div style="max-width: 440px">
<div style="font-weight: 700; font-size: 34px; line-height: 1.2; letter-spacing: -0.01em">Faturamento, limite e DAS <span style="color: #8FDD55">sob controle.</span></div>
<div style="margin-top: 16px; color: #C9D6D2; font-size: 15px">Importe suas notas e extratos e acompanhe sua empresa num painel só.</div>
</div>
<div style="font-size: 12px; color: #C9D6D2">Para MEI e ME no Simples Nacional</div>
</aside>

<main style="flex: 1 1 420px; box-sizing: border-box; padding: 48px 32px; display: flex; align-items: center; justify-content: center">
<form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Entrar</h1>
<div style="color: #5F6B6A">Bem-vindo de volta.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 13px; font-weight: 600">E-mail</label>
<input id="email" type="email" placeholder="voce@empresa.com.br" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #879290; border-radius: 10px; font: inherit; color: #16302B; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<label for="senha" style="font-size: 13px; font-weight: 600">Senha</label>
<a href="#recuperar" style="font-size: 13px; font-weight: 600">Esqueci minha senha</a>
</div>
<input id="senha" type="password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #879290; border-radius: 10px; font: inherit; color: #16302B; background: #FFFFFF">
</div>
<a href="painel.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #8FDD55; color: #16302B; font-weight: 600; text-decoration: none">Entrar</a>
<div style="text-align: center; color: #5F6B6A">Não tem conta? <a href="cadastro.html" style="font-weight: 600">Criar conta</a></div>
</form>
</main>

</div>

</body>
</html>
