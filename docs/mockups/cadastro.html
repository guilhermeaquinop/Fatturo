<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar conta no Fatturo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F7A28}a:hover{color:#1B4A20}
</style>

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #FFFFFF; color: #16302B; font-family: 'Montserrat', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

<aside style="flex: 1 1 360px; box-sizing: border-box; background: #16302B; color: #FFFFFF; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
<div style="font-weight: 700; font-size: 20px">Fatturo</div>
<div style="max-width: 440px; display: flex; flex-direction: column; gap: 20px">
<div style="font-weight: 700; font-size: 34px; line-height: 1.2; letter-spacing: -0.01em">Comece em <span style="color: #8FDD55">três passos.</span></div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; color: #C9D6D2; font-size: 15px">
<li style="display: flex; gap: 12px; align-items: baseline"><span style="color: #8FDD55; font-weight: 700">1</span><span>Crie sua conta</span></li>
<li style="display: flex; gap: 12px; align-items: baseline"><span style="color: #8FDD55; font-weight: 700">2</span><span>Informe os dados e o enquadramento da empresa</span></li>
<li style="display: flex; gap: 12px; align-items: baseline"><span style="color: #8FDD55; font-weight: 700">3</span><span>Importe suas notas e extratos</span></li>
</ol>
</div>
<div style="font-size: 12px; color: #C9D6D2">Para MEI e ME no Simples Nacional</div>
</aside>

<main style="flex: 1 1 420px; box-sizing: border-box; padding: 48px 32px; display: flex; align-items: center; justify-content: center">
<form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Criar conta</h1>
<div style="color: #5F6B6A">Leva menos de um minuto.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 13px; font-weight: 600">Nome</label>
<input id="nome" type="text" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #879290; border-radius: 10px; font: inherit; color: #16302B; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 13px; font-weight: 600">E-mail</label>
<input id="email" type="email" placeholder="voce@empresa.com.br" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #879290; border-radius: 10px; font: inherit; color: #16302B; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="senha" style="font-size: 13px; font-weight: 600">Senha</label>
<input id="senha" type="password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #879290; border-radius: 10px; font: inherit; color: #16302B; background: #FFFFFF">
<div style="font-size: 12px; color: #5F6B6A">Mínimo de 10 caracteres.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="confirma" style="font-size: 13px; font-weight: 600">Confirmar senha</label>
<input id="confirma" type="password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #879290; border-radius: 10px; font: inherit; color: #16302B; background: #FFFFFF">
</div>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #5F6B6A"><input type="checkbox" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #3FA535"><span>Li e aceito os <a href="#termos" style="font-weight: 600">termos de uso</a> e a <a href="#privacidade" style="font-weight: 600">política de privacidade</a>.</span></label>
<a href="configuracao.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #8FDD55; color: #16302B; font-weight: 600; text-decoration: none">Criar conta</a>
<div style="text-align: center; color: #5F6B6A">Já tem conta? <a href="login.html" style="font-weight: 600">Entrar</a></div>
</form>
</main>

</div>

</body>
</html>
